{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Student Results</title>
    <link rel="stylesheet" href="{% static 'add_results.css' %}">
</head>
<body>

    <div class="container">

        <div class="header">
            <h2>Upload Student Results</h2>
            <p>Enter the academic performance of your students.</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST">
            {% csrf_token %}

            <div class="form-group">
                <label>Select Student</label>
                <select name="student" required>
                    <option value="">Choose Student</option>

                    {% for student in students %}
                        <option value="{{ student.student_id }}">
                            {{ student.firstName }} {{ student.surname }}
                            ({{ student.student_id }})
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Select Subject</label>
                <select name="subject" required>
                    <option value="">Choose Subject</option>

                    {% for subject in subjects %}
                        <option value="{{ subject.id }}">
                            {{ subject.name }}
                        </option>
                    {% endfor %}
                </select>
            </div>

            <div class="form-group">
                <label>Academic Session</label>
                <input
                    type="text"
                    name="session"
                    placeholder="e.g. 2026/2027"
                    pattern="[0-9]{4}/[0-9]{4}"
                    required
                >
            </div>

            <div class="form-group">
                <label>Select Term</label>
                <select name="term" required>
                    <option value="">Choose Term</option>
                    <option value="First Term">First Term</option>
                    <option value="Second Term">Second Term</option>
                    <option value="Third Term">Third Term</option>
                </select>
            </div>

            <div class="form-group">
                <label>Test Mark (Maximum 40)</label>
                <input
                    type="number"
                    name="test"
                    min="0"
                    max="40"
                    required
                >
            </div>

            <div class="form-group">
                <label>Exam Mark (Maximum 60)</label>
                <input
                    type="number"
                    name="exam"
                    min="0"
                    max="60"
                    required
                >
            </div>

            <button type="submit">Save Result</button>

        </form>

    </div>

</body>
</html>
