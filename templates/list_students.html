<div class="table-container">
                    <table>
                        <thead>
                            <tr>
                                <th>Student Name </th>
                                <th>Student ID</th>
                                <th>Class</th>
                                <th>Email</th>
                                <th>Gender</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for name in names %}
                            <tr>
                                <td>
                                    <div class="student">
                                        <div class="student-avatar purple-bg">{{name.firstName}}</div>
                                        <strong>{{name.surname}}</strong>
                                    </div>
                                </td>
                                <td>{{name.student_id}}</td>
                                <td>{{name.studentClass}}</td>
                                <td>{{name.email}}</td>
                                <td>{{name.registrationDate}}</td>
                                <td><span class="status active-status">{{name.gender}}</span></td>
                            </tr>
                            {% empty %}
                            <tr>
                                <td>We don't Have Any Record Yet</td>
                            </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
