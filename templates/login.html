
{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>School Login</title>
    <link rel="stylesheet" href="{% static 'login.css' %}">
</head>
<body>
    <main class="login-page">
        <section class="login-card">

            <div>
                <p class="eyebrow">Welcome back</p>
                <h1>School Login</h1>
            </div>

            <p class="subtitle">Login to your school account</p>

            <p class="role-label">Login as:</p>

            <div class="role-picker" aria-label="Select account type">
                <button class="role-button" type="button"
                        data-role="Admin" aria-pressed="false">
                    Admin
                </button>

                <button class="role-button" type="button"
                        data-role="Teacher" aria-pressed="false">
                    Teacher
                </button>

                <button class="role-button" type="button"
                        data-role="Student" aria-pressed="false">
                    Student
                </button>
            </div>

            {% if messages %}
                <div class="message-box">
                    {% for message in messages %}
                        <p>{{ message }}</p>
                    {% endfor %}
                </div>
            {% endif %}

            <form action="{% url 'login' %}" method="POST">
                {% csrf_token %}

                <input type="hidden" name="user_role" id="user_role" value="">

                <div class="field-group">
                    <label for="username">Username</label>
                    <input id="username" type="text" name="username"
                           placeholder="Enter your username" required>
                </div>

                <div class="field-group">
                    <label for="password">Password</label>
                    <input id="password" type="password" name="password"
                           placeholder="Enter your password" required>
                </div>

                <button type="submit" class="submit-btn">Login</button>
            </form>

            <p class="switch-link">
                Need an account?
                <a href="{% url 'register' %}">Create one</a>
            </p>

        </section>
    </main>

    <script>
        const roleButtons = document.querySelectorAll('.role-button');
        const userRoleInput = document.getElementById('user_role');
        const loginForm = document.querySelector('form');

        roleButtons.forEach((button) => {
            button.addEventListener('click', () => {

                roleButtons.forEach((btn) => {
                    btn.classList.remove('active');
                    btn.setAttribute('aria-pressed', 'false');
                });

                button.classList.add('active');
                button.setAttribute('aria-pressed', 'true');

                userRoleInput.value = button.dataset.role;
            });
        });

        loginForm.addEventListener('submit', (event) => {
            if (!userRoleInput.value) {
                event.preventDefault();
                alert('Please select your account type.');
            }
        });
    </script>

</body>
</html>
