{% load static %}
<link rel="stylesheet" href="{% static 'add_new_student.css' %}">
<h1>
    ADD NEW STUDENT
</h1>
<form action="new_student" method="POST">
    {% csrf_token %}
    <p>
        Student ID
    </p>
    <input type="tel" name="student_ID" placeholder="Enter Student ID" required> 
    <p>
        student_firstName
    </p>
    <input type="text" name="student_firstName" placeholder="Enter Student First Name" required>
   
    <p>
        student_surname
    </p>
    <input type="text" name="student_surname" placeholder="Enter Student Surname Name" required>
    <p>
        student_middleName
    </p>
    <input type="text" name="student_middleName" placeholder="Enter Student Middle Name" required>

    <p>
        Email
    </p>
    <input type="email" name="student_email" placeholder="Enter Student Email" required>
    <p>
        Class
    </p>
    <input type="text" name="student_class" placeholder="Enter Student's Current Class" required>
    <p>
        Gender
    </p>
    <input type="text" name="student_gender" placeholder="Enter Student's Gender" required>
    <br>
    <button type="submit">Add User</button>
</form>
