 
{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Admin</title>
    <link rel="stylesheet" href="{% static 'css/register_admin.css' %}">
</head>
<body>

    <div class="register-container">

        <div class="register-header">
            <h1>Create Admin Account</h1>
            <p>Set up your administrator account</p>
        </div>

        {% if messages %}
            {% for message in messages %}
                <div class="message {{ message.tags }}">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="POST" action="{% url 'admin_registration' %}">
            {% csrf_token %}

            <div class="form-group">
                <label for="full_name">Full name</label>
                <input type="text" id="full_name" name="full name"
                       placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username"
                       placeholder="Choose a username" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email"
                       placeholder="Enter your email address" required>
            </div>

            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password"
                       placeholder="Create a password" required>
            </div>

            <div class="form-group">
                <label for="confirm_password">Confirm Password</label>
                <input type="password" id="confirm_password"
                       name="confirm_password"
                       placeholder="Confirm your password" required>
            </div>

            <button type="submit">Create Admin Account</button>
        </form>

        <div class="login-link">
            <p>Already have an account? <a href="{% url 'login_admin' %}">Login</a></p>
        </div>

    </div>

</body>
</html>
