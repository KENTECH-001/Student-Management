{% load static %}
<link rel="stylesheet" href="{% static 'register_student.css' %}">

<div class="auth-container">
    <h1>
        Set Your Password
    </h1>

    <form action="{% url 'register_student' %}" method="POST">
        {% csrf_token %}
            <p>
                Enter The Password:
            </p>
            <input type="password" name="password" placeholder="Enater The Password" required >
            <p>
                Confirm Password:
            </p>
            <input type="password" name="confirm_password" placeholder="Confirm Your Password" required>
            <br>
            <button type="submit">Set Password</button>
    </form>
</div>
