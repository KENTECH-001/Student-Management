{% load static %}
<link rel="stylesheet" href="{% static 'update.css' %}">
<h2>Find Student</h2>

<form action="{% url 'update_student' %}" method="GET">
    <input type="text" name="id"
           placeholder="Enter Student ID" required>
    <button type="submit">Find Student</button>
</form>
{% for message in messages %}
<h3>
    {{message}}
</h3>
{% endfor %}

{% if details %}
    <h2>Update Student Information</h2>

    <form action="{% url 'update_student' %}" method="POST">
        {% csrf_token %}

        <input type="hidden" name="id"
               value="{{ details.student_id }}">

        <input type="text" name="firstname"
               value="{{ details.firstName }}" placeholder="First Name" required>

        <input type="text" name="surname"
               value="{{ details.surname }}" placeholder="Surname" required>

        <input type="text" name="middlename"
               value="{{ details.middleName }}" placeholder="Middle Name" required>

        <input type="email" name="email"
               value="{{ details.email }}" placeholder="Email" required>

        <input type="text" name="class"
               value="{{ details.studentClass }}" placeholder="Class" required>

        <input type="text" name="gender"
               value="{{ details.gender }}" placeholder="Gender" required>

        <button type="submit">Save Changes</button>
    </form>
    {% else %}
    <h3>
        Student Not Found
    </h3>
{% endif %}
