{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Update Teacher</title>
    <link rel="stylesheet" href="{% static 'update_teacher.css' %}">
</head>
<body>

    <div class="form-container">
        <h1>Update Teacher Details</h1>
        <p class="subtitle">Edit the teacher's information below.</p>

        {% for message in messages %}
            <div class="message">{{ message }}</div>
        {% endfor %}

        <form action="{% url 'update_teacher' %}" method="POST">
            {% csrf_token %}

            <input type="hidden" name="username" value="{{ details.user.username }}">

            <div class="form-group">
                <label>Username</label>
                <input type="text" value="{{ details.user.username }}" readonly>
            </div>

            <div class="form-group">
                <label for="fullname">Full Name</label>
                <input
                    type="text"
                    id="fullname"
                    name="fullname"
                    value="{{ details.user.first_name }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="email">Email Address</label>
                <input
                    type="email"
                    id="email"
                    name="email"
                    value="{{ details.user.email }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="gender">Gender</label>
                <input
                    type="text"
                    id="gender"
                    name="gender"
                    value="{{ details.gender }}"
                    required
                >
            </div>

            <div class="form-group">
                <label for="assigned_class">Assigned Class</label>
                <input
                    type="text"
                    id="assigned_class"
                    name="assigned_class"
                    value="{{ details.assigned_class }}"
                    required
                >
            </div>

            <button type="submit">Save Changes</button>
        </form>

        <a class="back-link" href="{% url 'admin_dashboard' %}">
            Back to Dashboard
        </a>
    </div>

</body>
</html>
